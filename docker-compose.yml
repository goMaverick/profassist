
# Backend development configuration
# Usage: docker-compose up -d

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: profassist_backend:dev
    container_name: profassist_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/skills:/app/skills:ro
      - ./backend/cli:/app/cli:ro
      - media_data:/app/media
    env_file:
      - ./backend/.env.example
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PREFECT_API_URL=http://prefect-server:4200/api
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=profassist
      - S3_SECRET_KEY=profassist-secret
      - S3_BUCKET=profassist
      - MOODLE_MODE=fake
      - PROFASSIST_AUTO_SEED=true
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DOCLING_ENABLED=${DOCLING_ENABLED:-false}
      - MEM0_HISTORY_PATH=/tmp/profassist-mem0.db
    command: ["sh", "/app/docker-entrypoint.sh"]
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped


  db:
    image: postgres:16-alpine
    container_name: profassist_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-profassist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port exposed only for local development - remove in production
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: valkey/valkey:9-alpine
    container_name: profassist_redis
    # Port exposed only for local development - remove in production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: profassist_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: profassist_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.local/share/prefect/
    environment:
      - PREFECT_UI_URL=http://localhost:4200/api
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prefect-runner:
    image: profassist_backend:dev
    pull_policy: never
    container_name: profassist_prefect_runner
    volumes:
      - ./backend/app:/app/app:ro
      - media_data:/app/media
    command: python -m app.worker.prefect_app
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env.example
    environment:
      - DEBUG=true
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
      - PREFECT_API_URL=http://prefect-server:4200/api
      - MOODLE_MODE=fake
      - PROFASSIST_AUTO_SEED=false
    networks:
      - backend
    depends_on:
      prefect-server:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  minio:
    # Official minio/minio is no longer pullable from Docker Hub. This image is MinIO.
    image: bitnamilegacy/minio:latest
    container_name: profassist_minio
    environment:
      - MINIO_ROOT_USER=profassist
      - MINIO_ROOT_PASSWORD=profassist-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: profassist_mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://postgres:postgres@db:5432/profassist
      --default-artifact-root s3://profassist/mlflow
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=profassist
      - AWS_SECRET_ACCESS_KEY=profassist-secret
    ports:
      - "5000:5000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
        - NEXT_PUBLIC_SITE_URL=http://localhost:3000
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=50
        - NEXT_PUBLIC_RAG_ENABLED=true
    container_name: profassist_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://app:8000
      - COOKIE_SECURE=false
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  qdrant_data:
  prefect_data:
  minio_data:
